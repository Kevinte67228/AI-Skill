name: Weekly GitHub Skill Report - Generate

on:
  schedule:
    # 每週六 UTC 22:00 執行 = 台北時間週日早上 06:00（先產生報告，留2小時緩衝給寄信排程）
    - cron: "0 22 * * 6"
  workflow_dispatch: {}   # 允許手動點擊執行，方便測試

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 GitHub 仓库资料
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_repos.py

      - name: 呼叫 Gemini 產生報告
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_report.py

      - name: 提交更新的檔案回倉庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "自動更新每週開源技能報告 $(date +'%Y-%m-%d')"
          git push
