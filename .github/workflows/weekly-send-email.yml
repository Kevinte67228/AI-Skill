name: Weekly GitHub Skill Report - Send Email

on:
  schedule:
    # 每週日 UTC 00:00 執行 = 台北時間週日早上 08:00
    - cron: "0 0 * * 0"
  workflow_dispatch: {}   # 允許手動點擊執行，方便測試

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 寄送 Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_email.py
